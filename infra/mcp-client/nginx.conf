# Serves the built demo MCP client. Easypanel terminates TLS and forwards to
# port 80, so this server block never handles HTTPS itself.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

  # Vite writes content-hashed filenames, so a given file never changes and can
  # be cached indefinitely.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html is the one unhashed file, and it names the hashed bundles. Without
  # revalidation a redeploy would keep pointing browsers at the previous build.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # The client is a single page that owns its own view state; any unknown path
  # returns the shell rather than a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
