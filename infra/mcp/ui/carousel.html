<!DOCTYPE html>
<!--
  The Globie Earth "carousel" MCP App (SEP-1865 / io.modelcontextprotocol/ui).

  One archetype document, shared by every tool that answers with a shelf of
  image-bearing shows - search_podcasts, get_trending_podcasts and
  get_podcasts_by_theme. Which view to draw is read from the host's own
  hostContext.toolInfo.tool.name (SEP-1865); a host that omits toolInfo falls
  back to inferring the view from the payload's own shape. src/ui/apps.ts holds
  the tool -> archetype mapping, and its names must match the VIEWS keys below.

  Entirely self-contained - no external script, style, image or font - which is
  what lets it run under the host's restrictive default CSP (img-src 'self'
  data:; connect-src 'none'), so `_meta.ui.csp` need not widen anything.

  That last point is a deliberate call, and it is why the covers are drawn
  rather than fetched. A show's artwork URL comes from the upstream Podcast
  Index and can live on any host at all, so no finite resourceDomains list
  covers the shelf; declaring one origin would show some covers and silently
  drop the rest. A cover derived from the show's own name - a fixed gradient
  plus its initial - is always there, needs no network, and leaks no third-party
  request from the sandbox. If the host's declared-domain handling later proves
  it accepts a scheme source, real artwork can be added behind the same slot
  without touching anything else.

  Authored at the Alexa+ design-guide's 768x480 base and scaled by one root
  `zoom` (1.667 for the far-field Show 8/15, 1280x800). Light and dark are both
  first-class. Touch targets are >=48x48.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Globie Earth</title>
    <style>
      :root {
        /* One root scale for the whole surface; the host's container width
           decides it (see applyHostContext). */
        --ui-scale: 1;
        /* Spacing: 2 / 6 / 8 / 12 / 16 / 20 / 24. */
        --space-2: 2px;
        --space-6: 6px;
        --space-8: 8px;
        --space-12: 12px;
        --space-16: 16px;
        --space-20: 20px;
        --space-24: 24px;
        /* Shape: 4 / 8 / 12 / 16 + shapeCircle. */
        --shape-8: 8px;
        --shape-12: 12px;
        --shape-16: 16px;
        --shape-circle: 9999px;
        /* The touch-target floor the accessibility guide requires. */
        --target: 48px;
        /* Typography, at the 768x480 base. */
        --font-display: 40px;
        --font-headline: 20px;
        --font-title: 16px;
        --font-body: 14px;
        --font-caption: 12px;
        --font-label: 10px;
        /* The widget is sized to the 768x480 authoring viewport; the host may
           give it more room in fullscreen. */
        --base-width: 768px;
        /* Wide enough that the next card peeks past the edge, which is what
           tells a far-field viewer the shelf scrolls at all. */
        --slide-width: 200px;
      }

      /* Light and dark parity, keyed off hostContext.theme. Text tones are
         picked for the required contrast (>=4.5:1 under 18px, >=3:1 at or
         above). */
      html[data-theme='dark'] {
        --surface: #14181e;
        --surface-inner: #1b2028;
        --text: #f2f4f7;
        --text-muted: #aab3c0;
        --border: #2b323c;
        --button: #2d415e;
        --button-text: #eaf0f8;
        --accent: #58c06a;
        --slide-hover: #232a34;
      }
      html[data-theme='light'] {
        --surface: #ffffff;
        --surface-inner: #faf9fb;
        --text: #171b21;
        --text-muted: #49515e;
        --border: #e2e4ea;
        --button: #2d415e;
        --button-text: #ffffff;
        --accent: #2e7d32;
        --slide-hover: #f1f2f6;
      }

      html {
        zoom: var(--ui-scale);
        background: transparent;
      }
      body {
        margin: 0;
        padding: 0;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans', sans-serif;
        font-size: var(--font-body);
        line-height: 1.35;
      }

      .card {
        box-sizing: border-box;
        width: var(--base-width);
        max-width: 100%;
        padding: var(--space-20);
        border: 1px solid var(--border);
        border-radius: var(--shape-16);
        background: var(--surface);
      }

      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-12);
      }
      .mark {
        display: flex;
        align-items: center;
        gap: var(--space-8);
        min-width: 0;
      }
      .leaf {
        flex: none;
        width: 20px;
        height: 20px;
        border-radius: var(--shape-circle);
        background: var(--accent);
      }
      .brand {
        font-size: var(--font-label);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-muted);
      }
      .title {
        margin: var(--space-2) 0 0;
        font-size: var(--font-headline);
        font-weight: 600;
        color: var(--text);
        overflow-wrap: anywhere;
      }

      /* 48x48 minimum, whatever the label says. */
      .toggle {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-6);
        min-width: var(--target);
        min-height: var(--target);
        padding: 0 var(--space-12);
        border: 0;
        border-radius: var(--shape-12);
        background: var(--button);
        color: var(--button-text);
        font: inherit;
        font-size: var(--font-caption);
        font-weight: 600;
        cursor: pointer;
      }
      .toggle[hidden] {
        display: none;
      }
      .toggle:focus-visible {
        outline: 3px solid var(--text);
        outline-offset: 2px;
      }

      .summary {
        margin: var(--space-16) 0 0;
        font-size: var(--font-caption);
        color: var(--text-muted);
      }
      .summary[hidden] {
        display: none;
      }

      /* The carousel itself: one row that scrolls sideways, snapping card to
         card. It is a real list, so a screen reader still hears "list, N
         items"; the sideways scroll is presentation. */
      .track {
        display: flex;
        gap: var(--space-12);
        margin: var(--space-12) 0 0;
        padding: 0 0 var(--space-8);
        list-style: none;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scrollbar-width: thin;
      }
      .slide {
        flex: none;
        width: var(--slide-width);
        scroll-snap-align: start;
      }

      /* One show (or one theme). It is a button when there is somewhere to go
         and a plain block otherwise, so the affordance never lies. */
      .show {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: var(--space-8);
        width: 100%;
        min-height: var(--target);
        padding: var(--space-8);
        border: 1px solid var(--border);
        border-radius: var(--shape-12);
        background: var(--surface-inner);
        color: var(--text);
        font: inherit;
        text-align: left;
      }
      button.show {
        cursor: pointer;
      }
      button.show:hover {
        background: var(--slide-hover);
      }
      button.show:focus-visible {
        outline: 3px solid var(--text);
        outline-offset: 2px;
      }

      /* The drawn cover: a fixed gradient with the show's initial over it. The
         gradient is dark in both themes and the letter is white, so the pair
         keeps its contrast no matter what the host's theme is. */
      .cover {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: var(--shape-8);
        overflow: hidden;
      }
      .cover-letter {
        font-size: 44px;
        font-weight: 700;
        line-height: 1;
        color: #ffffff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
      }

      /* Two lines, then a hard stop: a long show title must not change the
         height of one card and so misalign the whole shelf. */
      .show-title {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: var(--font-title);
        font-weight: 600;
        color: var(--text);
      }
      .show-author {
        display: block;
        font-size: var(--font-caption);
        color: var(--text-muted);
        overflow-wrap: anywhere;
      }
      .show-meta {
        display: block;
        margin-top: auto;
        font-size: var(--font-caption);
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }
      .badge {
        display: inline-block;
        padding: var(--space-2) var(--space-8);
        border: 1px solid var(--border);
        border-radius: var(--shape-circle);
        background: var(--surface);
        font-size: var(--font-label);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-muted);
      }
      .note {
        margin: var(--space-12) 0 0;
        font-size: var(--font-caption);
        color: var(--text-muted);
      }
      .note[hidden] {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
        .track {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" id="card">
      <div class="head">
        <div class="mark">
          <span class="leaf" aria-hidden="true"></span>
          <div>
            <div class="brand">Globie Earth</div>
            <h1 class="title" id="heading">One moment…</h1>
          </div>
        </div>
        <!-- Shown only when the host offers both inline and fullscreen. -->
        <button class="toggle" id="toggle" type="button" hidden aria-label="Expand to fullscreen">
          Fullscreen
        </button>
      </div>

      <p class="summary" id="summary" hidden></p>
      <ul class="track" id="track" aria-live="polite"></ul>
      <p class="note" id="note" hidden></p>
    </main>

    <script>
      (function () {
        'use strict';

        var APP_INFO = { name: 'globie-earth-carousel', version: '1.0.0' };
        var root = document.documentElement;
        var card = document.getElementById('card');
        var headingEl = document.getElementById('heading');
        var toggle = document.getElementById('toggle');
        var summaryEl = document.getElementById('summary');
        var trackEl = document.getElementById('track');
        var noteEl = document.getElementById('note');

        var view = null;
        var latest = null;

        // ---- The postMessage JSON-RPC 2.0 bridge (SEP-1865) ------------------
        // The view is a sandboxed, possibly opaque-origin iframe: the host frame
        // is the only peer and postMessage is the only channel. No origin can be
        // verified against, so messages from any frame other than our parent are
        // ignored outright.
        var nextId = 1;
        var pending = Object.create(null);

        function postToHost(message) {
          window.parent.postMessage(message, '*');
        }

        function request(method, params) {
          var id = 'globie-' + nextId++;
          return new Promise(function (resolve) {
            pending[id] = resolve;
            postToHost({ jsonrpc: '2.0', id: id, method: method, params: params });
          });
        }

        function notifyHost(method, params) {
          postToHost({ jsonrpc: '2.0', method: method, params: params });
        }

        // ---- Size reporting --------------------------------------------------
        var lastSize = '';
        function reportSize() {
          var size = Math.ceil(root.scrollWidth) + 'x' + Math.ceil(root.scrollHeight);
          if (size === lastSize) return;
          lastSize = size;
          notifyHost('ui/notifications/size-changed', {
            width: Math.ceil(root.scrollWidth),
            height: Math.ceil(root.scrollHeight),
          });
        }

        // ---- hostContext -----------------------------------------------------
        var currentMode = 'inline';

        function applyHostContext(context) {
          if (!context) return;
          if (context.theme === 'light' || context.theme === 'dark') {
            root.setAttribute('data-theme', context.theme);
          }
          // One root scale, never per-element: author at 768x480, zoom 1.667 for
          // the far-field Show 8/15 (1280x800).
          var dimensions = context.containerDimensions || {};
          var width = dimensions.maxWidth || dimensions.width || 0;
          root.style.setProperty('--ui-scale', width >= 1024 ? '1.667' : '1');

          currentMode = context.displayMode || 'inline';
          var modes = context.availableDisplayModes || [];
          toggle.hidden = !(modes.indexOf('inline') !== -1 && modes.indexOf('fullscreen') !== -1);
          updateToggleLabel();
          rememberToolName(context);
          reportSize();
        }

        function rememberToolName(context) {
          var tool = context && context.toolInfo && context.toolInfo.tool;
          var name = tool && typeof tool.name === 'string' ? tool.name : null;
          if (name && VIEWS[name]) {
            view = name;
            if (latest) render(latest);
          }
        }

        function updateToggleLabel() {
          var expand = currentMode !== 'fullscreen';
          toggle.textContent = expand ? 'Fullscreen' : 'Exit';
          toggle.setAttribute('aria-label', expand ? 'Expand to fullscreen' : 'Exit fullscreen');
        }

        // ---- Small DOM helpers ----------------------------------------------
        function el(tag, className, text) {
          var node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined && text !== null && text !== '') {
            // textContent, never innerHTML: nothing the server returns is markup.
            node.appendChild(document.createTextNode(String(text)));
          }
          return node;
        }

        function present(value) {
          return value !== null && value !== undefined && value !== '';
        }

        function plural(count, one, many) {
          return count + ' ' + (count === 1 ? one : many);
        }

        /** `newestItemAt` is an ISO instant; only the day is useful on a tile. */
        function day(instant) {
          return present(instant) ? String(instant).slice(0, 10) : null;
        }

        function setText(node, value) {
          node.textContent = present(value) ? String(value) : '';
          node.hidden = !present(value);
        }

        // ---- The drawn cover -------------------------------------------------
        // A stable hash of the show's own name picks the hue, so the same show
        // always gets the same cover and two neighbours rarely collide.
        function hash(text) {
          var value = 0;
          for (var i = 0; i < text.length; i++) {
            value = (value * 31 + text.charCodeAt(i)) | 0;
          }
          return Math.abs(value);
        }

        function initial(title) {
          var trimmed = String(title || '').trim();
          return trimmed ? trimmed.charAt(0).toUpperCase() : '♪';
        }

        function cover(seedText, title) {
          var hue = hash(seedText) % 360;
          var node = el('span', 'cover');
          // Decorative: the initial only repeats the show's own title, which is
          // announced from the text right beside it.
          node.setAttribute('aria-hidden', 'true');
          // Dark in both themes, white letter over it: contrast is a property of
          // the cover itself, not of whatever theme the host is in.
          node.style.background =
            'linear-gradient(150deg, hsl(' +
            hue +
            ' 42% 34%), hsl(' +
            ((hue + 48) % 360) +
            ' 46% 16%))';
          node.appendChild(el('span', 'cover-letter', initial(title)));
          return node;
        }

        // ---- One slide -------------------------------------------------------
        // `item.url` present means there is somewhere to go, and only then is the
        // slide a button. Everything inside is phrasing content, so the markup
        // stays valid inside it.
        function slide(item) {
          var li = el('li', 'slide');
          var interactive = present(item.url);
          var node = interactive ? el('button', 'show') : el('div', 'show');
          if (interactive) {
            node.type = 'button';
            // Deliberately no aria-label: it would replace the slide's own text
            // as the accessible name, and the episode count, date and author are
            // exactly what tells two shows apart.
            // data-url, read back on click: the handler is delegated, so no
            // per-slide closure keeps the DOM node alive.
            node.setAttribute('data-url', item.url);
          }

          node.appendChild(cover(item.seed, item.title));
          // No badge element at all when there is no category to show, rather
          // than an empty pill.
          if (present(item.badge)) node.appendChild(el('span', 'badge', item.badge));
          node.appendChild(el('span', 'show-title', item.title));
          node.appendChild(el('span', 'show-author', item.author));
          node.appendChild(el('span', 'show-meta', item.meta));

          li.appendChild(node);
          return li;
        }

        function draw(items) {
          var nodes = [];
          for (var i = 0; i < items.length; i++) nodes.push(slide(items[i]));
          trackEl.replaceChildren.apply(trackEl, nodes);
        }

        // ---- The views -------------------------------------------------------
        // One podcast card's shape, shared by all three feed views.
        function showItems(feeds) {
          var items = [];
          for (var i = 0; i < feeds.length; i++) {
            var feed = feeds[i] || {};
            var meta = [];
            if (typeof feed.episodeCount === 'number') {
              meta.push(plural(feed.episodeCount, 'episode', 'episodes'));
            }
            if (present(day(feed.newestItemAt))) meta.push('latest ' + day(feed.newestItemAt));
            items.push({
              seed: String(feed.id || feed.title || i),
              title: feed.title || 'Untitled show',
              author: feed.author,
              badge: Array.isArray(feed.categories) ? feed.categories[0] : null,
              meta: meta.join(' · '),
              url: feed.link || feed.url || null,
            });
          }
          return items;
        }

        function themeItems(themes) {
          var items = [];
          for (var i = 0; i < themes.length; i++) {
            var theme = themes[i] || {};
            items.push({
              seed: 'theme-' + (theme.theme || theme.label || i),
              title: theme.label || theme.theme || 'Theme',
              author: theme.theme,
              badge: null,
              // The theme list is a menu, not a shelf: there is nothing to open.
              url: null,
            });
          }
          return items;
        }

        var VIEWS = {
          search_podcasts: function (payload) {
            var feeds = Array.isArray(payload.feeds) ? payload.feeds : [];
            headingEl.textContent = 'Podcast search';
            setText(summaryEl, plural(feeds.length, 'show', 'shows'));
            draw(showItems(feeds));
          },

          get_trending_podcasts: function (payload) {
            var feeds = Array.isArray(payload.feeds) ? payload.feeds : [];
            headingEl.textContent = 'Trending shows';
            setText(summaryEl, plural(feeds.length, 'show', 'shows'));
            draw(showItems(feeds));
          },

          get_podcasts_by_theme: function (payload) {
            // Called with no theme, this tool lists the themes themselves.
            if (Array.isArray(payload.themes)) {
              headingEl.textContent = 'Listening themes';
              setText(summaryEl, plural(payload.themes.length, 'theme', 'themes'));
              draw(themeItems(payload.themes));
              return;
            }
            var feeds = Array.isArray(payload.feeds) ? payload.feeds : [];
            headingEl.textContent = present(payload.theme) ? 'Theme: ' + payload.theme : 'By theme';
            setText(summaryEl, plural(feeds.length, 'show', 'shows'));
            draw(showItems(feeds));
          },
        };

        // When the host never names the tool, the payload's own shape still says
        // which view it is. Search and trending share one shape, so the fallback
        // picks the generic of the two.
        function inferView(payload) {
          if (!payload || typeof payload !== 'object') return null;
          if (Array.isArray(payload.themes)) return 'get_podcasts_by_theme';
          if (Array.isArray(payload.feeds)) {
            return present(payload.theme) ? 'get_podcasts_by_theme' : 'search_podcasts';
          }
          return null;
        }

        // ---- The tool result -------------------------------------------------
        function extractPayload(params) {
          if (!params) return null;
          if (params.structuredContent) return params.structuredContent;
          var block = Array.isArray(params.content) ? params.content[0] : null;
          if (block && block.type === 'text') {
            try {
              return JSON.parse(block.text);
            } catch (error) {
              return null;
            }
          }
          return null;
        }

        function render(payload) {
          if (!payload) return;
          latest = payload;
          var name = view || inferView(payload);
          var drawView = name ? VIEWS[name] : null;
          summaryEl.hidden = true;
          noteEl.hidden = true;
          trackEl.replaceChildren();
          if (!drawView) {
            headingEl.textContent = 'Result';
            reportSize();
            return;
          }
          headingEl.textContent = '';
          drawView(payload);
          // The tools set `note` only when the shelf is empty ("No shows matched
          // that search."), so an empty carousel is never left unexplained.
          setText(noteEl, payload.note);
          reportSize();
        }

        function showPlaceholder(message) {
          // Nothing to draw yet, so the waiting line goes where the count will:
          // the shelf's own heading stays put and only the body swaps.
          headingEl.textContent = 'One moment…';
          summaryEl.hidden = false;
          summaryEl.textContent = message || 'Please wait.';
          setText(noteEl, null);
          trackEl.replaceChildren();
          reportSize();
        }

        // ---- Host messages ---------------------------------------------------
        window.addEventListener('message', function (event) {
          // Only the parent frame is a peer.
          if (event.source !== window.parent) return;
          var message = event.data;
          if (!message || message.jsonrpc !== '2.0') return;

          if (message.id !== undefined && pending[message.id]) {
            var settle = pending[message.id];
            delete pending[message.id];
            settle(message.result);
            return;
          }

          switch (message.method) {
            case 'ui/notifications/tool-input':
              showPlaceholder('Lining up the shelf…');
              break;
            case 'ui/notifications/tool-result':
              render(extractPayload(message.params));
              break;
            case 'ui/notifications/tool-cancelled':
              showPlaceholder('That search was cancelled.');
              break;
            case 'ui/notifications/host-context-changed':
              applyHostContext(message.params);
              break;
            case 'ui/resource-teardown':
              break;
            default:
              break;
          }
        });

        // One delegated handler for the whole shelf: a click on (or in) a slide
        // that has somewhere to go opens it through the host.
        trackEl.addEventListener('click', function (event) {
          var node = event.target;
          while (node && node !== trackEl && node.getAttribute('data-url') === null) {
            node = node.parentNode;
          }
          if (!node || node === trackEl) return;
          var url = node.getAttribute('data-url');
          if (url) request('ui/open-link', { url: url });
        });

        toggle.addEventListener('click', function () {
          var target = currentMode === 'fullscreen' ? 'inline' : 'fullscreen';
          // SEP-1865 names this parameter `mode`, and answers with the mode it
          // actually set - which may differ from the one requested.
          request('ui/request-display-mode', { mode: target }).then(function (result) {
            currentMode = (result && result.mode) || target;
            updateToggleLabel();
            reportSize();
          });
        });

        if ('ResizeObserver' in window) {
          new ResizeObserver(reportSize).observe(card);
        }

        // ---- Handshake -------------------------------------------------------
        request('ui/initialize', {
          appInfo: APP_INFO,
          appCapabilities: { availableDisplayModes: ['inline', 'fullscreen'] },
        })
          .then(function (result) {
            applyHostContext(result && result.hostContext);
            notifyHost('ui/notifications/initialized', {});
          })
          .catch(function () {
            /* no host: stay on the placeholder */
          })
          .then(reportSize);
      })();
    </script>
  </body>
</html>
